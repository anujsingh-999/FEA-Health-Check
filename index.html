<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEA Performance Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=20260605a" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>FEA Performance Dashboard</h1>
        </div>
      </header>

      <nav class="view-tabs flow-tabs" aria-label="Operational flow view">
        <button type="button" data-view-tab="induction"><small>01</small> Inductee Arrival At Gahru</button>
        <button type="button" data-view-tab="employment"><small>02</small> Employment</button>
        <button type="button" data-view-tab="branch"><small>03</small> Branch Performance Matrix</button>
      </nav>

      <section id="studentOrgKpis" class="org-kpi-grid" data-tab-panel="branch" aria-label="Organization branch performance metrics"></section>

      <section class="dashboard-layout">
        <aside id="kpis" class="kpi-grid" aria-label="Top-line dashboard metrics"></aside>

        <div class="dashboard-stage">
          <section class="main-grid" data-tab-panel="branch">
            <article class="panel trend-panel">
              <div class="panel-heading">
                <h2 id="trendTitle">Performance over time</h2>
                <div class="heading-actions">
                  <label class="compact-filter">
                    Attendance view
                    <select id="attendanceViewSelect">
                      <option value="latest">Latest week</option>
                      <option value="4w" selected>4-week average</option>
                      <option value="3m">3-month average</option>
                    </select>
                  </label>
                  <div id="trendLegend" class="legend"></div>
                </div>
              </div>
              <div id="trendChart" class="chart"></div>
            </article>
          </section>

          <section class="panel" data-tab-panel="induction">
            <div class="panel-heading">
              <h2>Inductee Arrival At Gahru</h2>
            </div>
            <div id="inductionChart" class="chart induction-chart"></div>
          </section>

          <section class="panel" data-tab-panel="employment" data-employment-panel="teacher retention capacity">
            <div class="panel-heading">
              <h2 id="staffTrendTitle">Teacher Net Increase</h2>
            </div>
            <div id="teacherGrowthChart" class="chart teacher-growth-chart"></div>
          </section>

          <section class="panel branch-growth-panel" data-tab-panel="branch">
            <div class="panel-heading">
              <h2>RM Branch Growth</h2>
              <label class="compact-filter">
                RM
                <select id="branchRmSelect"></select>
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>RM</th>
                    <th>Active branches</th>
                    <th>4W growth %</th>
                    <th>Pipeline teachers</th>
                    <th>December 2026 milestone</th>
                  </tr>
                </thead>
                <tbody id="branchGrowthTable"></tbody>
              </table>
            </div>
          </section>

          <section class="split-grid" data-tab-panel="branch">
            <article class="panel">
              <div class="panel-heading">
                <h2>Area Manager Performance</h2>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Rank</th>
                      <th>AM</th>
                      <th>State</th>
                      <th>RM</th>
                      <th>Latest</th>
                      <th>4W Avg</th>
                    </tr>
                  </thead>
                  <tbody id="amTable"></tbody>
                </table>
              </div>
            </article>
          </section>
        </div>

        <aside class="focus-panel" aria-label="Priority attention list">
          <div class="focus-heading">
            <span id="focusTitle">Needs Attention</span>
            <strong id="focusCount">0</strong>
          </div>
          <div id="focusList" class="focus-list"></div>
        </aside>
      </section>
    </main>

    <script src="dashboard-data.js?v=20260513a"></script>
    <script src="branch-structure.js?v=20260513a"></script>
    <script src="operations-data.js?v=20260515a"></script>
    <script src="app.js?v=20260525b"></script>
  </body>
</html>
